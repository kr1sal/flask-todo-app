on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Init db
      env:
        FLASK_APP: manage.py
      run: |
        rm -f todo.sqlite
        flask db upgrade
        python - <<'EOF'
        import sqlite3
        c = sqlite3.connect("todo.sqlite")
        tables = {r[0] for r in c.execute("select name from sqlite_master where type='table'")}
        assert {"todo", "alembic_version"} <= tables, tables
        print("tables:", sorted(tables))
        EOF
    - name: Smoke test the running server
      run: |
        python manage.py &
        SERVER_PID=$!
        trap 'kill $SERVER_PID' EXIT
        for i in $(seq 1 20); do
          curl -sf http://127.0.0.1:7345/ -o /dev/null && break
          sleep 0.5
        done
        test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7345/)" = "200"
        test "$(curl -s -o /dev/null -w '%{http_code}' -X POST --data-urlencode 'title=ci' http://127.0.0.1:7345/)" = "302"
        test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7345/999999)" = "404"

  docker:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t flask-todo-app:ci .
